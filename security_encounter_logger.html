
<style>
  .btn-deploy {
    width: 100%;
    padding: 18px 16px;
    font-size: 15px;
    font-weight: 500;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    color: var(--color-text-primary);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .btn-deploy:hover { background: var(--color-background-secondary); border-color: var(--color-border-primary); }
  .btn-deploy:active { transform: scale(0.99); }
  .btn-deploy.success { border-color: #1D9E75; }
  .btn-deploy .chevron { font-size: 18px; color: var(--color-text-tertiary); }
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--color-text-primary);
    display: none;
    z-index: 999;
    max-width: 260px;
  }
  .toast.show { display: block; }
  .toast.ok { border-left: 3px solid #1D9E75; }
  .toast.err { border-left: 3px solid #E24B4A; }
  .pill {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    font-weight: 500;
  }
  .pill-ok { background: #E1F5EE; color: #0F6E56; }
  .pill-err { background: #FCEBEB; color: #A32D2D; }
  #config-panel {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-lg);
    padding: 16px;
    margin-bottom: 1.5rem;
    border: 0.5px solid var(--color-border-tertiary);
  }
  #config-panel input {
    width: 100%;
    box-sizing: border-box;
    margin-top: 4px;
    margin-bottom: 10px;
    font-size: 13px;
  }
  #config-panel label { font-size: 12px; color: var(--color-text-secondary); }
  .counter-badge {
    background: var(--color-background-secondary);
    border-radius: 99px;
    padding: 2px 10px;
    font-size: 12px;
    color: var(--color-text-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    min-width: 28px;
    text-align: center;
  }
</style>

<div style="padding: 1.5rem 0 1rem;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 0.25rem;">
    <p style="font-size:20px; font-weight:500; margin:0; color:var(--color-text-primary);">Security encounter</p>
    <span id="session-count" class="counter-badge">0 logged</span>
  </div>
  <p style="font-size:13px; color:var(--color-text-secondary); margin:0 0 1.5rem;">Select the deployment for this encounter</p>

  <div id="config-panel" style="display:none;">
    <p style="font-size:13px; font-weight:500; margin:0 0 12px; color:var(--color-text-primary);">Configuration</p>
    <label>Jira domain</label>
    <input id="cfg-domain" type="text" placeholder="yourcompany.atlassian.net" />
    <label>Email</label>
    <input id="cfg-email" type="text" placeholder="you@company.com" />
    <label>API token</label>
    <input id="cfg-token" type="password" placeholder="Your Jira API token" />
    <label>Project key</label>
    <input id="cfg-project" type="text" placeholder="e.g. LE" />
    <button onclick="saveConfig()" style="font-size:13px; padding:8px 16px;">Save &amp; reload options</button>
  </div>

  <div id="deploy-list" style="display:flex; flex-direction:column; gap:10px;">
    <p style="font-size:13px; color:var(--color-text-secondary);">Loading deployments...</p>
  </div>

  <p id="error-msg" style="display:none; font-size:13px; color:#A32D2D; margin-top:1rem;"></p>

  <div style="margin-top:1.5rem; display:flex; justify-content:flex-end;">
    <button onclick="toggleConfig()" style="font-size:12px; color:var(--color-text-tertiary); background:none; border:none; cursor:pointer; padding:0;">Configure</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const DEFAULTS = {
  domain: 'daxbot.atlassian.net',
  email: 'levi.hanson@daxbot.com',
  token: '',
  project: 'LE',
  fieldId: 'customfield_10200',
  issueType: 'Security Encounter'
};

function getCfg() {
  return {
    domain: localStorage.getItem('jira_domain') || DEFAULTS.domain,
    email: localStorage.getItem('jira_email') || DEFAULTS.email,
    token: localStorage.getItem('jira_token') || DEFAULTS.token,
    project: localStorage.getItem('jira_project') || DEFAULTS.project,
    fieldId: DEFAULTS.fieldId,
    issueType: DEFAULTS.issueType
  };
}

function saveConfig() {
  localStorage.setItem('jira_domain', document.getElementById('cfg-domain').value);
  localStorage.setItem('jira_email', document.getElementById('cfg-email').value);
  localStorage.setItem('jira_token', document.getElementById('cfg-token').value);
  localStorage.setItem('jira_project', document.getElementById('cfg-project').value);
  toggleConfig();
  loadDeployments();
}

function toggleConfig() {
  const p = document.getElementById('config-panel');
  const cfg = getCfg();
  if (p.style.display === 'none') {
    p.style.display = 'block';
    document.getElementById('cfg-domain').value = cfg.domain;
    document.getElementById('cfg-email').value = cfg.email;
    document.getElementById('cfg-token').value = cfg.token;
    document.getElementById('cfg-project').value = cfg.project;
  } else {
    p.style.display = 'none';
  }
}

let sessionCount = 0;
const deployCounters = {};

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.className = 'toast', 2800);
}

async function loadDeployments() {
  const cfg = getCfg();
  const list = document.getElementById('deploy-list');
  const err = document.getElementById('error-msg');
  err.style.display = 'none';
  list.innerHTML = '<p style="font-size:13px; color:var(--color-text-secondary);">Loading deployments...</p>';

  if (!cfg.token) {
    list.innerHTML = '<p style="font-size:13px; color:#A32D2D;">No API token set. Click Configure below to add your token.</p>';
    return;
  }

  const auth = btoa(cfg.email + ':' + cfg.token);
  const url = `https://${cfg.domain}/rest/api/3/field/${cfg.fieldId}/option?maxResults=50`;

  try {
    const res = await fetch(url, {
      headers: {
        'Authorization': 'Basic ' + auth,
        'Accept': 'application/json'
      }
    });

    if (!res.ok) {
      const txt = await res.text();
      list.innerHTML = '';
      err.style.display = 'block';
      err.textContent = `Could not load deployments (${res.status}). Check your token and domain in Configure.`;
      return;
    }

    const data = await res.json();
    const options = data.values || data;

    if (!options.length) {
      list.innerHTML = '<p style="font-size:13px; color:var(--color-text-secondary);">No options found for this field.</p>';
      return;
    }

    list.innerHTML = '';
    options.forEach(opt => {
      deployCounters[opt.id] = 0;
      const btn = document.createElement('button');
      btn.className = 'btn-deploy';
      btn.dataset.optId = opt.id;
      btn.dataset.optVal = opt.value;
      btn.innerHTML = `<span>${opt.value}</span><span class="counter-badge" id="cnt-${opt.id}">0</span>`;
      btn.onclick = () => createIssue(opt.id, opt.value, btn);
      list.appendChild(btn);
    });

  } catch(e) {
    list.innerHTML = '';
    err.style.display = 'block';
    err.textContent = 'Network error. This tool must be hosted where it can reach the Jira API (not a local file).';
  }
}

async function createIssue(optId, optValue, btn) {
  const cfg = getCfg();
  const auth = btoa(cfg.email + ':' + cfg.token);
  btn.disabled = true;
  const originalHTML = btn.innerHTML;
  btn.innerHTML = `<span>${optValue}</span><span style="font-size:12px; color:var(--color-text-tertiary);">Creating...</span>`;

  const body = {
    fields: {
      project: { key: cfg.project },
      summary: `Security encounter — ${optValue}`,
      issuetype: { name: cfg.issueType },
      [cfg.fieldId]: { id: String(optId) }
    }
  };

  try {
    const res = await fetch(`https://${cfg.domain}/rest/api/3/issue`, {
      method: 'POST',
      headers: {
        'Authorization': 'Basic ' + auth,
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (res.ok) {
      sessionCount++;
      deployCounters[optId] = (deployCounters[optId] || 0) + 1;
      document.getElementById('session-count').textContent = sessionCount + (sessionCount === 1 ? ' logged' : ' logged');
      const cntEl = document.getElementById('cnt-' + optId);
      if (cntEl) cntEl.textContent = deployCounters[optId];
      showToast(data.key + ' created', true);
      btn.classList.add('success');
      setTimeout(() => btn.classList.remove('success'), 1500);
    } else {
      showToast('Error: ' + (data.errorMessages?.[0] || res.status), false);
    }
  } catch(e) {
    showToast('Network error', false);
  }

  btn.disabled = false;
  btn.innerHTML = originalHTML;
  const cntEl = document.getElementById('cnt-' + optId);
  if (cntEl) cntEl.textContent = deployCounters[optId] || 0;
}

loadDeployments();
</script>

name: Ready Widgets APK

on:
  push:
    paths:
      - "ready-widgets/**"
      - ".github/workflows/ready-widgets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ready-widgets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # One fixed signing key, so in-app updates install over the previous build.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.READY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ready.keystore"
            echo "READY_KEYSTORE_FILE=$RUNNER_TEMP/ready.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::READY_KEYSTORE_BASE64 is not set; this build is debug-signed and cannot update an installed app."
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug \
            -PversionCode=${{ github.run_number }} \
            -PupdateTag="ready-widgets-${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk ready-widgets.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ready-widgets-apk
          path: ready-widgets/ready-widgets.apk

      # A rolling pre-release per branch, so the APK can be downloaded straight from a phone.
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ready-widgets-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" ready-widgets.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ready Widgets (${GITHUB_REF_NAME})" \
            --notes "build ${{ github.run_number }}, from ${GITHUB_SHA::7}. On your phone: download ready-widgets.apk, open it, and allow installing from your browser if asked."
